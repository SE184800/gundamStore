name: CI

on:
  pull_request:
    branches:
      - sandbox
      - main
  push:
    branches:
      - sandbox
      - main

jobs:
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    env:
      CI: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

  backend-check:
    name: Backend check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      JWT_SECRET: ci-test-secret-change-in-production
      JWT_EXPIRES_IN: 1d
      FRONTEND_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Prisma generate
        run: npm exec prisma -- generate

      - name: Prisma validate
        run: npm exec prisma -- validate

      - name: Backend check
        run: npm run check
